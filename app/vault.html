<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';">
    <title>Ollie Vault</title>
    <link rel="stylesheet" href="components/vault/vault.css">
</head>

<body>
    <div class="vault-app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="components/assets/ollie-icon.svg" alt="Ollie Vault Logo" width="30" height="30"
                    class="sidebar-logo">
                <h2>Ollie Vault</h2>
            </div>

            <nav class="nav-group">
                <!-- Primary Actions -->
                <div class="nav-section">
                    <button class="nav-btn nav-btn-primary" id="createBtn" aria-label="Create a new Vault">✨ New Base Vault</button>
                    <button class="nav-btn" id="saveBtn" aria-label="Save current vault to JPEGs">💾 Save To JPEGs</button>
                    <button class="nav-btn" id="lockBtn" style="display: none;" aria-label="Lock current vault session">🔒 Lock Vault</button>
                </div>
                <!-- Management & Security Tools (visible when unlocked) -->
                <div class="nav-section" id="unlockedNav">
                    <button class="nav-btn" id="changePwBtn" style="display: none;" aria-label="Change Master Password">🔑 Change Password</button>
                    <button class="nav-btn" id="totpSettingsBtn" style="display: none;" aria-label="Configure 2FA Security Gate">🛡️ 2FA Security</button>
                    <button class="nav-btn" id="importBtn" style="display: none;" aria-label="Import JSON or CSV data">📥 Import JSON / CSV</button>
                    <button class="nav-btn" id="exportEncryptedBtn" style="display: none;" aria-label="Export Encrypted Backup Container">📦 Backup Encrypted (.ollie)</button>
                    <button class="nav-btn" id="exportBtn" style="display: none;" aria-label="Export vault to plaintext JSON">📤 Export (Plaintext)</button>
                </div>
            </nav>

            <!-- Tag Filter Section -->
            <div class="tag-section" aria-label="Filter by tags">
                <div class="tag-section-header">
                    <span class="tag-section-title">Tags <span id="tagCountBadge" class="badge">0</span></span>
                    <div class="tag-header-actions">
                        <button id="tagSortToggleBtn" class="tag-sort-btn" title="Toggle tag sort order (Frequency / A-Z)">Freq</button>
                        <button id="tagSortDirBtn" class="tag-sort-btn" title="Reverse sort direction">↓</button>
                        <button id="clearTagsBtn" class="tag-clear-btn" style="display: none;" aria-label="Clear all active tag filters">✕ Clear</button>
                    </div>
                </div>
                <input type="search" id="tagSearchInput" class="tag-search-input" placeholder="Filter tags..." aria-label="Search and filter tags">
                <div id="tagList" class="tag-list" role="group" aria-label="Available Tags">
                    <!-- Tags populated here dynamically -->
                </div>
            </div>
        </aside>

        <!-- Main Content (Drop Zone) -->
        <main class="drop-zone" id="dropZone">
            <header class="app-header">
                <div class="header-controls">
                    <div class="status-badge" aria-live="polite">
                        <span class="status-dot"></span>
                        <span id="statusText">Locked</span>
                    </div>
                </div>

                <div class="header-controls">
                    <div class="view-mode-selector" role="radiogroup" aria-label="Layout View Mode">
                        <button type="button" class="view-mode-btn active" data-mode="sidebar" id="viewModeSidebar" title="Side Bar view (clean cards, inspector pane on right)">Side Bar</button>
                        <button type="button" class="view-mode-btn" data-mode="card" id="viewModeCard" title="Card view (4x expansion animation)">Card View</button>
                        <button type="button" class="view-mode-btn" data-mode="both" id="viewModeBoth" title="Both (4x card expansion and inspector pane)">Both</button>
                    </div>
                    <input type="search" id="searchInput" class="search-input" placeholder="Search entries..."
                        aria-label="Search items by title, username, or URL">
                    <select id="sortSelect" class="sort-select" aria-label="Sort Entries">
                        <option value="newest">Newest First</option>
                        <option value="oldest">Oldest First</option>
                        <option value="az">A-Z Name</option>
                        <option value="za">Z-A Name</option>
                    </select>
                    <button class="btn btn-primary" id="addBtn" aria-label="Add a new entry">➕ Add Entry</button>
                    <button class="btn-icon" id="shortcutsBtn" title="Keyboard Shortcuts (?)" aria-label="Keyboard Shortcuts">⌨️</button>
                </div>
            </header>

            <div class="vault-workspace" id="vaultWorkspace">
                <div id="vaultList" class="vault-list-container">
                    <div class="empty-state">
                        <div class="empty-icon">
                            <img id="emptyMascot" src="components/assets/ollie-animated.svg" alt="Ollie the Maine Coon Mascot" width="120"
                                height="120" />
                        </div>
                        <h3>Drop Vault Here</h3>
                        <p>Drag and drop a folder of images to load your vault.</p>
                    </div>
                </div>

                <aside id="detailPane" class="detail-pane" aria-label="Entry Details" style="display: none;">
                    <!-- Populated dynamically upon card selection -->
                </aside>
            </div>

            <div class="status-bar" role="status" aria-live="polite">
                <span id="itemCount">0 Items</span>
                <div class="capacity-meter" id="capacityMeterContainer">
                    <div class="capacity-bar dual-gauge">
                        <div id="capacityProgress" class="capacity-progress" title="Steganographic storage capacity"></div>
                        <div id="vaultProgress" class="vault-progress" title="Secrets library footprint"></div>
                    </div>
                    <span id="capacityText" title="Total steganographic storage capacity across loaded images">Used: 0 B / Total: 0 B</span>
                </div>
                <span id="versionText">Ollie v0.3</span>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay"
        style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; flex-direction: column; color: white;">
        <div style="margin-bottom: 1rem;">
            <img src="components/assets/ollie-thinking.svg" alt="Ollie Thinking" width="100" height="100">
        </div>
        <p>Processing...</p>
    </div>

    <script type="module" src="components/vault/vault-ui.js"></script>
</body>

</html>
